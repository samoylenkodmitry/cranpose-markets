name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy for the web
        run: cargo clippy --lib --target wasm32-unknown-unknown --features web -- -D warnings
      - name: Test
        run: cargo test

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install cranpose-build
        run: |
          base=https://github.com/samoylenkodmitry/cranpose-build/releases/download/v0.3.0
          curl -fsSLO "$base/cranpose-build-x86_64-unknown-linux-gnu.zip"
          curl -fsSLO "$base/cranpose-build-x86_64-unknown-linux-gnu.zip.sha256"
          sha256sum -c cranpose-build-x86_64-unknown-linux-gnu.zip.sha256
          mkdir -p "$HOME/.local/bin"
          unzip -q cranpose-build-x86_64-unknown-linux-gnu.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web bundle
        run: ./build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist
